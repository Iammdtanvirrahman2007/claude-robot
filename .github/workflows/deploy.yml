name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate bridge JavaScript
        run: |
          node --check server/bridge.js
          node --check server/brainRunner.js
          node --check src/api/realRobotApi.js

      - name: Smoke test native C++ runtime
        run: |
          cat > /tmp/brain-smoke.cpp <<'EOF'
          #include "brain/robot_runtime.hpp"
          Robot robot;
          int main() {
            robot.forward(40);
            robot.turn_right(30);
            robot.stop();
            return 0;
          }
          EOF
          g++ -std=c++17 -pthread -I. /tmp/brain-smoke.cpp -o /tmp/brain-smoke

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
